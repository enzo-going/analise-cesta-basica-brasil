name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Só leitura para o GITHUB_TOKEN: nenhum job aqui precisa escrever no repositório.
permissions:
  contents: read

jobs:
  reproduz:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configura Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instala dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (so regras de erro, ver ruff.toml)
        run: |
          pip install ruff
          ruff check .

      - name: Reprocessa os dados brutos
        run: python src/process_data.py

      - name: Confere se os CSVs versionados batem com o reprocessamento
        run: git diff --exit-code -- data/processed
